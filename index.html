<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<title>Workout Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<div class="hdr-wrap"><header class="topbar"><div><h1 id="title">Workouts</h1><div class="ver">v10 · stretch warm-up</div></div><div id="topAction"></div></header>
<button id="profileBar" class="profile-bar" aria-label="Switch profile"></button></div>
<div id="profileSheet" class="sheet-wrap" hidden></div>
<main id="app"></main>
<div id="restBar" class="rest-bar" hidden></div>
<nav class="tabs">
  <button data-tab="home" class="tab active"><span>🏋️</span>Workouts</button>
  <button data-tab="weight" class="tab"><span>⚖️</span>Weight</button>
  <button data-tab="program" class="tab"><span>📋</span>Program</button>
  <button data-tab="data" class="tab"><span>💾</span>Backup</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" class="toast"></div>
<script src="templates.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
